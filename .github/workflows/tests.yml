name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime deps (features + model)
        run: |
          python -m pip install --upgrade pip
          # From requirements.txt, NOT unpinned: the bundled model was pickled
          # with scikit-learn 1.6.1 and sklearn private-module paths change
          # across versions (ModuleNotFoundError: No module named '_loss').
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest tests/ -v
